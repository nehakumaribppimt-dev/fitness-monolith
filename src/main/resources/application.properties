spring.application.name=fitness-monolith

#Database Congifuration

#providing database url -: syntax = protocol:database:where database is hosted/name of database
spring.datasource.url=jdbc:mysql://localhost:3306/fitness_demo1
#username
spring.datasource.username=root
#password
spring.datasource.password=password
#jdbc driver name
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#whenever i make any changes in schema,those updates should be propagate in db automatically
spring.jpa.hibernate.ddl-auto=update
#we are telling hibernate to use mysql language
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG